apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Own project namespace (moved out of claude-sandbox 2026-10-30, homelab-ops Q6/CHECKLIST Phase 2).
namespace: share

labels:
  - pairs:
      app.kubernetes.io/part-of: share
    includeSelectors: false

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Image built and pushed by .github/workflows/image.yml. Bump newTag when you release a new git tag.
images:
  - name: share-app
    newName: ghcr.io/chevvyy/share-app
    newTag: "1.0.0"
