apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Target namespace. Change this if you deploy somewhere other than claude-sandbox.
namespace: claude-sandbox

labels:
  - pairs:
      app.kubernetes.io/part-of: share
    includeSelectors: false

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# >>> PLACEHOLDER: set this to the image you pushed (see README, step 3). <<<
images:
  - name: share-app
    newName: YOUR_REGISTRY/share-app
    newTag: "1.0.0"
