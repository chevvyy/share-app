apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Target namespace. Change this if you deploy somewhere other than claude-sandbox.
namespace: claude-sandbox

labels:
  - pairs:
      app.kubernetes.io/part-of: share
    includeSelectors: false

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Image built and pushed by .github/workflows/image.yml. Bump newTag when you release a new git tag.
images:
  - name: share-app
    newName: ghcr.io/chevvyy/share-app
    newTag: "1.0.0"
