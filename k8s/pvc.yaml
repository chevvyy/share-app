# Storage for uploaded files, on the NAS (nfs-bulk, the homelab default class).
#
# SIZING ASSUMPTION: worst case is MAX_SETS (10) x MAX_SET_BYTES (5 GiB) = 50 GiB.
# The request below adds ~10% headroom for metadata and in-flight temp files.
# Adjust it to the NAS share's free space. If you shrink it below 50Gi, also
# lower MAX_SETS or MAX_SET_BYTES in deployment.yaml.
#
# NOTE: NFS provisioners usually do not enforce the requested size. The app
# separately checks the volume's real free space before every upload and
# answers HTTP 507 when it runs low, so a full share degrades cleanly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: share-data
  labels:
    app.kubernetes.io/name: share
spec:
  storageClassName: nfs-bulk
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 55Gi
